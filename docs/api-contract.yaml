openapi: 3.1.0
info:
  title: Life Tracker API
  version: "1.1.0"
  description: >
    Contract between backend and frontend for Life Tracker v1.
    All routes are prefixed /api/v1. Auth is a Bearer JWT on every route
    except /auth/register and /auth/login.
    Maps to user stories in docs/user-stories.md (US-xx, EC-xx).
    Decimal fields (target_value, check-in value, weights) are stored with 2
    decimal places, so a value that rounds onto or past a bound (e.g.
    target_value >= 9999999999.995, or a positive weight below 0.005) is
    rejected with 422 like any other out-of-range value.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: categories
    description: >
      Per-user goal categories. Every user gets 4 defaults on register
      (Fitness 🏃 teal, Study 📚 violet, Career 💼 indigo, Custom ✨ slate),
      which can be renamed/recoloured but never deleted. Max 12 per user.
      Another user's (or a missing) category is always 404.
  - name: goals
  - name: milestones
  - name: check-ins
  - name: scoring
  - name: dashboard
  - name: reviews
  - name: settings
  - name: journal
    description: >
      Free-form notes. Journal entries NEVER affect any score, grade, streak or
      snapshot. Every route is scoped to the current user: another user's entry
      (or a missing one) is always 404, never 403.
  - name: health
  - name: internal

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

  /auth/register:
    post:
      tags: [auth]
      summary: Sign up (US-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created, tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error (bad email/password/name)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [auth]
      summary: Log in (US-02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      tags: [auth]
      summary: Current user profile (US-03, US-19)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [auth]
      summary: Update profile name (US-19)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
              required: [name]
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /categories:
    get:
      tags: [categories]
      summary: List the user's categories in display order (sort_order ascending)
      responses:
        "200":
          description: All of the user's categories (4 defaults + any custom ones, max 12)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [categories]
      summary: Create a custom category (screen 12b). Appended at the end of the order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
      responses:
        "201":
          description: Category created (is_default false, goal_count 0)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "409":
          description: >
            CATEGORY_LIMIT_REACHED (user already has 12 categories) or
            CATEGORY_NAME_TAKEN (same name, case-insensitive, after trimming)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /categories/order:
    patch:
      tags: [categories]
      summary: Reorder categories (drag to reorder on screen 12)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryOrderRequest"
      responses:
        "200":
          description: All categories in the new order (sort_order rewritten 0..n-1)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "422":
          description: >
            VALIDATION_ERROR when category_ids is not exactly the user's full
            set of category ids (missing, extra, duplicate or foreign ids)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [categories]
      summary: Rename / recolour / change emoji. Defaults can be edited too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdateRequest"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "409":
          description: CATEGORY_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [categories]
      summary: Delete a custom category, moving its goals to another category
      description: >
        Default categories can't be deleted (409 CATEGORY_IS_DEFAULT).
        If the category has goals (any status, archived included), `move_to`
        is required: every goal is moved to that category first, then the
        category and its weight are deleted, in one transaction. Without
        `move_to` a category with goals gets 409 CATEGORY_HAS_GOALS. An empty
        category is deleted straight away and `move_to` is ignored.
      parameters:
        - name: move_to
          in: query
          required: false
          description: Another category of the same user. Same id as the one being deleted, or another user's / unknown id → 422 INVALID_MOVE_TARGET.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "409":
          description: CATEGORY_IS_DEFAULT or CATEGORY_HAS_GOALS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: INVALID_MOVE_TARGET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /goals:
    get:
      tags: [goals]
      summary: List goals, optionally filtered by category (US-05)
      parameters:
        - name: category_id
          in: query
          required: false
          description: Only goals in this category. Unknown or another user's id → empty list.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GoalStatus"
      responses:
        "200":
          description: Goals for the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [goals]
      summary: Create a goal (US-04, US-08, US-09, US-10)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalCreateRequest"
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /goals/{goalId}:
    parameters:
      - name: goalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [goals]
      summary: Goal detail (US-16)
      responses:
        "200":
          description: Goal detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [goals]
      summary: Edit a goal (US-06, EC-05, screen 11b)
      description: >
        Partial update. After applying the fields sent, the WHOLE goal is
        re-validated with the same type rules as create (see
        GoalCreateRequest), so e.g. sending only target_value below
        start_value on an "increase" goal re-derives direction to "decrease"
        unless direction is also sent. `type` can only change while the goal
        has zero check-ins (409 TYPE_LOCKED otherwise). When the type
        changes, the client may send explicit null for the old type's fields
        (start_value, target_value, unit, direction, frequency_type,
        weekdays, frequency_per_week); null means "clear it" and is accepted,
        and the server also clears them itself. Sending null for a field that
        the resulting type requires is a 422. Setting status to
        "archived" sets archived_at to now; setting it to anything else
        clears archived_at.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdateRequest"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "409":
          description: TYPE_LOCKED (type sent and different, but the goal already has check-ins)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [goals]
      summary: Delete a goal, including its check-ins and snapshots (US-07, EC-04)
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /goals/{goalId}/milestones:
    parameters:
      - name: goalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [milestones]
      summary: Add a subtask to a milestone goal (US-10)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneCreateRequest"
      responses:
        "201":
          description: Milestone created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /milestones/{milestoneId}:
    parameters:
      - name: milestoneId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [milestones]
      summary: Edit or complete a subtask (US-10)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneUpdateRequest"
      responses:
        "200":
          description: Updated milestone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [milestones]
      summary: Remove a subtask
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /goals/{goalId}/check-ins:
    parameters:
      - name: goalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [check-ins]
      summary: Check-in history for a goal, newest first (US-16)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckIn"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [check-ins]
      summary: Log a check-in (US-11, EC-02, EC-03)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInCreateRequest"
      responses:
        "201":
          description: Check-in saved; goal score recalculated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /check-ins/{checkInId}:
    parameters:
      - name: checkInId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [check-ins]
      summary: Delete a check-in; score recalculates without it (US-12)
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /goals/{goalId}/score:
    parameters:
      - name: goalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [scoring]
      summary: Current score breakdown for a goal (US-13, EC-07, EC-08)
      responses:
        "200":
          description: Score breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalScore"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /goals/{goalId}/score-history:
    parameters:
      - name: goalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [scoring]
      summary: Daily score snapshots for trend charts (US-16)
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            enum: [7, 30]
            default: 30
      responses:
        "200":
          description: Score history, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoreSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard:
    get:
      tags: [dashboard]
      summary: Overall score, category scores, streaks, trend, attention list (US-15, EC-09, EC-10)
      parameters:
        - name: trend_days
          in: query
          required: false
          schema:
            type: integer
            enum: [7, 30]
            default: 7
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reviews/weekly:
    get:
      tags: [reviews]
      summary: Weekly review for a given week (US-17)
      parameters:
        - name: week_start
          in: query
          required: true
          description: Monday of the requested week, YYYY-MM-DD. Must be between 1970-01-01 and 2100-12-31 (422 otherwise).
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Weekly review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /settings/category-weights:
    get:
      tags: [settings]
      summary: Current category weights (US-18)
      responses:
        "200":
          description: Category weights, default equal if unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryWeights"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [settings]
      summary: Set category weights (US-18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWeights"
      responses:
        "200":
          description: Updated category weights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryWeights"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /journal:
    get:
      tags: [journal]
      summary: List my journal entries, newest first, with search, tag + date filter and pagination
      parameters:
        - name: q
          in: query
          required: false
          description: >
            Case-insensitive substring search across title, body and tags.
            Leading/trailing whitespace is trimmed; empty = no search.
          schema:
            type: string
            maxLength: 200
        - name: tag
          in: query
          required: false
          description: Exact tag match (normalised the same way as on save, so "#Gym" matches "gym").
          schema:
            type: string
            maxLength: 32
        - name: from
          in: query
          required: false
          description: Inclusive start date, compared against created_at in the caller's tz_offset. Must be between 1970-01-01 and 2100-12-31 (422 otherwise).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive end date, compared against created_at in the caller's tz_offset. Must be >= from (422 otherwise). Must be between 1970-01-01 and 2100-12-31 (422 otherwise).
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/TzOffset"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page of entries (ordered created_at DESC, then id DESC for a stable order)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryPage"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [journal]
      summary: Create a journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryCreateRequest"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /journal/stats:
    get:
      tags: [journal]
      summary: Month stats + all-time tag counts for the Journal page header, rail and tag filter row
      parameters:
        - name: month
          in: query
          required: false
          description: YYYY-MM. Defaults to the current month in the caller's tz_offset.
          schema:
            type: string
            pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
            example: "2026-10"
        - $ref: "#/components/parameters/TzOffset"
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalStats"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /journal/export:
    get:
      tags: [journal]
      summary: Download my journal (and optionally goals + scores) as one Markdown file for pasting into an AI
      description: >
        Returns `text/markdown; charset=utf-8` with
        `Content-Disposition: attachment; filename="bihan-journal-YYYY-MM-DD-to-YYYY-MM-DD.md"`
        (the resolved from/to dates). Also returns `X-Journal-Entry-Count`,
        `X-Journal-Word-Count` and `X-Journal-Goal-Count` headers so the
        Export modal can show its summary line from the same request; the
        backend lists these (and Content-Disposition) in CORS
        `expose_headers` so they're readable cross-origin in local dev.
        Nothing is sent anywhere — this only builds the file.

        File format (keep it stable):

        ```
        # Bihan journal: Sep 18 – Oct 17, 2026
        Exported: Oct 17, 2026 · 24 entries

        ## Goals and scores            (only when include_goals=true)
        - Overall: 78 (A, Strong), ▲6 vs last week
        - Bench press 80 kg: 84 (A, Strong) · 72 / 80 kg
        - Finish ITAP3010: 51 (C, Slipping) · 3 / 8 subtasks
        - Morning run: Calibrating · 2 / 5 this week
        ### Weekly overall scores
        - Week of Sep 21: 70 (B)
        - Week of Sep 28: 72 (B)

        ## Entries
        ### Sat, Oct 17 · Leg day finally
        Mood: 4/5 (Good) · Tags: #gym #legs
        Squats felt heavy after a week off, but I hit…

        ### Fri, Oct 16
        Mood: 3/5 (Okay)
        Random thought: …
        ```

        Rules: entries oldest → newest; untitled entries show the date only;
        the Mood/Tags line drops whichever part is empty and is omitted
        entirely when both are; body line breaks are kept, and body lines
        that start with `#` are escaped as `\#` so they can't break the
        heading structure; dates are in the caller's tz_offset, and the
        year is added to entry headings only when the range spans more than
        one calendar year. Goals section lists every non-archived goal that
        started on or before `to` (current score, grade + label, progress),
        then the weekly overall scores for weeks inside the range that have
        snapshot data (sub-section omitted if none). With zero entries the
        file still downloads and the Entries section says "No entries in
        this range." Mood labels: 1 Rough, 2 Low, 3 Okay, 4 Good, 5 Great.

        Edge cases (as built, approved 2026-10-18):
        - One-day range: title is a single date, e.g. "# Bihan journal: Oct 17, 2026".
        - Overall line: "- Overall: Calibrating" when there is no overall
          score; ", no change vs last week" when the change is 0; the change
          part is left off when there is no score from 7 days earlier.
        - No goals to list: the Goals section says "- No goals yet."
        - Weekly overall scores: Monday-start weeks whose Monday falls inside
          [from, to] and that have at least one snapshot; the score is the
          overall as of the week's end (or today), same as /reviews/weekly.
        - Scores and habit "this week" progress use today in the caller's tz_offset.
        - X-Journal-Word-Count counts whitespace-separated words in entry
          bodies only (not titles), same rule as the frontend.
        - The export is read-only: it never writes score snapshots.
      parameters:
        - name: from
          in: query
          required: false
          description: >
            Inclusive. Defaults to the date of the user's first entry (or `to`
            if they have none). If `to` is earlier than the first entry, the
            default is clamped to `to` (no 422). Must be between 1970-01-01 and 2100-12-31 (422 otherwise).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive. Defaults to today in the caller's tz_offset. Must be >= from (422 otherwise). Must be between 1970-01-01 and 2100-12-31 (422 otherwise).
          schema:
            type: string
            format: date
        - name: include_goals
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - $ref: "#/components/parameters/TzOffset"
      responses:
        "200":
          description: The Markdown file
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="bihan-journal-2026-09-18-to-2026-10-17.md"'
            X-Journal-Entry-Count:
              schema:
                type: integer
            X-Journal-Word-Count:
              schema:
                type: integer
            X-Journal-Goal-Count:
              description: Goals listed in the file (0 when include_goals=false)
              schema:
                type: integer
          content:
            text/markdown:
              schema:
                type: string
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /journal/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        description: >
          A malformed id returns 404 (not 422), same as a missing entry or
          another user's entry. On PATCH, body validation runs first, so an
          invalid body returns 422 even for someone else's entry (nothing is
          changed or leaked).
        schema:
          type: string
          format: uuid
    get:
      tags: [journal]
      summary: Get one of my entries
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [journal]
      summary: Edit an entry (used by editor autosave). Only sent fields change; `tags` replaces the whole list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryUpdateRequest"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [journal]
      summary: Permanently delete an entry (hard delete)
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /internal/daily-snapshot:
    get:
      tags: [internal]
      summary: Compute and store today's score snapshot for every active goal of every user
      description: >
        Not user-facing. Triggered once a day by Vercel Cron (which only ever
        sends GET requests). Protected by `cronAuth`: compares the
        `Authorization: Bearer <token>` header against the server's
        `CRON_SECRET` env var, not a user JWT — no end-user ever calls this.
      security:
        - cronAuth: []
      responses:
        "200":
          description: Snapshot run completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots_written:
                    type: integer
                    example: 42
                required: [snapshots_written]
        "401":
          description: Missing or wrong CRON_SECRET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cronAuth:
      type: http
      scheme: bearer
      description: >
        Compared against the server's CRON_SECRET env var, not a user JWT.
        Used only by /internal/daily-snapshot.

  parameters:
    TzOffset:
      name: tz_offset
      in: query
      required: false
      description: >
        Caller's UTC offset in minutes, east positive (Nepal = 345). Frontend
        sends `-new Date().getTimezoneOffset()`. Used to turn dates into day
        boundaries and to print local dates/times. Defaults to 0 (UTC).
      schema:
        type: integer
        minimum: -720
        maximum: 840
        default: 0

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource does not exist or does not belong to the current user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: "email is required"
          required: [code, message]
      required: [error]

    IdentityColor:
      type: string
      description: User-picked identity colour (design/tokens.json colors.identity). Only tints emoji tiles, chips, dots and swatches; never grades.
      enum: [slate, violet, purple, pink, rose, sand, lime, teal, cyan, indigo]

    Emoji:
      type: string
      minLength: 1
      maxLength: 16
      description: >
        One emoji (the frontend picker guarantees a single grapheme). The
        server only checks 1-16 characters (code points, enough for ZWJ
        sequences and skin tones) and no whitespace.

    CategoryRef:
      type: object
      description: The category fields embedded in a Goal and in dashboard category scores.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emoji:
          $ref: "#/components/schemas/Emoji"
        color:
          $ref: "#/components/schemas/IdentityColor"
      required: [id, name, emoji, color]

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 24
        emoji:
          $ref: "#/components/schemas/Emoji"
        color:
          $ref: "#/components/schemas/IdentityColor"
        sort_order:
          type: integer
          description: 0-based position; order on Settings, dashboard category card, filters and pickers
        is_default:
          type: boolean
          description: One of the 4 seeded categories. Can be renamed/recoloured, never deleted.
        goal_count:
          type: integer
          description: Goals in this category, any status (archived included, since delete must move them too)
        created_at:
          type: string
          format: date-time
      required: [id, name, emoji, color, sort_order, is_default, goal_count, created_at]

    CategoryCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 24
          description: Trimmed by the server; empty after trimming → 422. Unique per user, case-insensitive (409 CATEGORY_NAME_TAKEN).
        emoji:
          $ref: "#/components/schemas/Emoji"
        color:
          $ref: "#/components/schemas/IdentityColor"
      required: [name, emoji, color]

    CategoryUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 24
        emoji:
          $ref: "#/components/schemas/Emoji"
        color:
          $ref: "#/components/schemas/IdentityColor"
      minProperties: 1

    CategoryOrderRequest:
      type: object
      properties:
        category_ids:
          type: array
          description: Every one of the user's category ids, exactly once, in the new order.
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 12
      required: [category_ids]

    NumericDirection:
      type: string
      enum: [increase, decrease]
      description: increase = target above start (bench 60 → 80 kg); decrease = target below start (5 km 32 → 28 min).

    FrequencyType:
      type: string
      enum: [daily, per_week, weekdays]
      description: >
        Habit schedule. daily = every day (frequency_per_week is set to 7 by
        the server). per_week = frequency_per_week times a week, any days.
        weekdays = only the days in `weekdays` (frequency_per_week is set to
        the number of days by the server); missing an unscheduled day costs
        nothing.

    Weekday:
      type: integer
      minimum: 1
      maximum: 7
      description: ISO weekday, 1 = Monday … 7 = Sunday

    GoalType:
      type: string
      enum: [numeric, habit, milestone]

    GoalStatus:
      type: string
      enum: [active, completed, archived]

    Grade:
      type: string
      enum: ["S", "A", "B", "C", "D", "Calibrating"]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
      required: [id, name, email, created_at]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: 8-128 characters and at most 72 bytes when UTF-8 encoded (bcrypt's limit), else 422.
      required: [name, email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 128
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        user:
          $ref: "#/components/schemas/User"
      required: [access_token, token_type, user]

    Milestone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        goal_id:
          type: string
          format: uuid
        title:
          type: string
        due_date:
          type: string
          format: date
          nullable: true
        is_done:
          type: boolean
        done_at:
          type: string
          format: date-time
          nullable: true
      required: [id, goal_id, title, is_done]

    MilestoneCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        due_date:
          type: string
          format: date
          description: Must be between 1970-01-01 and 2100-12-31 (422 otherwise).
          nullable: true
      required: [title]

    MilestoneUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        due_date:
          type: string
          format: date
          description: Must be between 1970-01-01 and 2100-12-31 (422 otherwise).
          nullable: true
        is_done:
          type: boolean
      minProperties: 1

    Goal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        category_id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/CategoryRef"
        emoji:
          type: string
          nullable: true
          description: null → show the category's emoji
        color:
          type: string
          nullable: true
          enum: [slate, violet, purple, pink, rose, sand, lime, teal, cyan, indigo, null]
          description: IdentityColor or null → use the category's colour
        type:
          $ref: "#/components/schemas/GoalType"
        start_value:
          type: number
          nullable: true
          description: Numeric goals only. Goals created before goal customisation have 0.
        target_value:
          type: number
          nullable: true
          description: Numeric goals only
        current_value:
          type: number
          nullable: true
          description: Numeric goals only; latest check-in value, equals start_value until the first check-in
        unit:
          type: string
          nullable: true
          description: Numeric goals only
        direction:
          type: string
          nullable: true
          enum: [increase, decrease, null]
          description: Numeric goals only (NumericDirection). Progress = (current - start) / (target - start), clamped 0..1.
        frequency_type:
          type: string
          nullable: true
          enum: [daily, per_week, weekdays, null]
          description: Habit goals only (FrequencyType)
        frequency_per_week:
          type: integer
          nullable: true
          description: >
            Habit goals: expected check-ins per week (7 for daily, the number
            of days for weekdays). Also allowed on numeric/milestone goals as
            the scoring consistency expectation (scoring README
            Interpretation 2).
        weekdays:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Weekday"
          description: Only when frequency_type = weekdays; sorted ascending, no duplicates
        why:
          type: string
          nullable: true
          maxLength: 140
          description: "\"Why this matters\", shown on the check-in screen"
        check_in_count:
          type: integer
          description: Total check-ins on this goal. When > 0 the type is locked (edit screen).
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: Set when status became archived; null otherwise
        start_date:
          type: string
          format: date
        deadline:
          type: string
          format: date
          nullable: true
          description: null means consistency-only pace (EC-01)
        weight:
          type: number
          default: 1
        status:
          $ref: "#/components/schemas/GoalStatus"
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
          description: Milestone goals only
        created_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - title
        - category_id
        - category
        - type
        - check_in_count
        - start_date
        - weight
        - status
        - created_at

    GoalCreateRequest:
      type: object
      description: >
        Type rules (all → 422 VALIDATION_ERROR, checked again on PATCH against
        the merged goal):
        numeric — target_value required; start_value defaults to 0;
        start_value ≠ target_value; direction defaults to the one implied by
        start vs target, and if sent must agree with it (target > start ⇔
        increase); current_value starts at start_value.
        habit — frequency_type required; per_week needs frequency_per_week;
        weekdays needs a non-empty weekdays list; for daily/weekdays the
        server sets frequency_per_week itself (7 / number of days) and
        ignores any value sent.
        milestone — deadline required on create.
        Non-numeric goals must not send start_value/direction; non-habit
        goals must not send frequency_type/weekdays (frequency_per_week stays
        allowed as the consistency expectation). start_date ≤ deadline.
        category_id must be one of the user's categories (422 INVALID_CATEGORY).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: The goal form limits the name to 60 characters; the API keeps 200 for existing goals.
        description:
          type: string
          maxLength: 2000
          nullable: true
        category_id:
          type: string
          format: uuid
        emoji:
          allOf:
            - $ref: "#/components/schemas/Emoji"
          nullable: true
        color:
          allOf:
            - $ref: "#/components/schemas/IdentityColor"
          nullable: true
        type:
          $ref: "#/components/schemas/GoalType"
        start_value:
          type: number
          minimum: 0
          exclusiveMaximum: 10000000000
          nullable: true
        target_value:
          type: number
          minimum: 0
          exclusiveMaximum: 10000000000
          nullable: true
          description: 0 is allowed (a decrease goal like "debt to 0"); still must differ from start_value
        unit:
          type: string
          maxLength: 32
          nullable: true
        direction:
          allOf:
            - $ref: "#/components/schemas/NumericDirection"
          nullable: true
        frequency_type:
          allOf:
            - $ref: "#/components/schemas/FrequencyType"
          nullable: true
        frequency_per_week:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: The goal form's stepper is 1-7; the API keeps 1-100 so goals created earlier stay editable.
        weekdays:
          type: array
          nullable: true
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Weekday"
        why:
          type: string
          maxLength: 140
          nullable: true
          description: Trimmed; empty → null
        milestones:
          type: array
          maxItems: 50
          description: Milestone goals only. Starter subtasks created with the goal, in this order (templates, screen 11).
          items:
            $ref: "#/components/schemas/MilestoneCreateRequest"
        start_date:
          type: string
          format: date
          description: Must be between 1970-01-01 and 2100-12-31 (422 otherwise).
        deadline:
          type: string
          format: date
          description: Must be between 1970-01-01 and 2100-12-31 (422 otherwise).
          nullable: true
        weight:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1000
          default: 1
      required: [title, category_id, type, start_date]

    GoalUpdateRequest:
      type: object
      description: Same field rules as GoalCreateRequest, validated against the merged goal. Send null to clear a nullable field (emoji/color back to the category's, why, deadline…).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          nullable: true
        category_id:
          type: string
          format: uuid
        emoji:
          allOf:
            - $ref: "#/components/schemas/Emoji"
          nullable: true
        color:
          allOf:
            - $ref: "#/components/schemas/IdentityColor"
          nullable: true
        type:
          $ref: "#/components/schemas/GoalType"
        start_value:
          type: number
          minimum: 0
          exclusiveMaximum: 10000000000
          nullable: true
        target_value:
          type: number
          minimum: 0
          exclusiveMaximum: 10000000000
          nullable: true
        unit:
          type: string
          maxLength: 32
          nullable: true
        direction:
          allOf:
            - $ref: "#/components/schemas/NumericDirection"
          nullable: true
        frequency_type:
          allOf:
            - $ref: "#/components/schemas/FrequencyType"
          nullable: true
        frequency_per_week:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
        weekdays:
          type: array
          nullable: true
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Weekday"
        why:
          type: string
          maxLength: 140
          nullable: true
        start_date:
          type: string
          format: date
          description: Must be between 1970-01-01 and 2100-12-31 and not after deadline (422 otherwise).
        deadline:
          type: string
          format: date
          description: Must be between 1970-01-01 and 2100-12-31 (422 otherwise).
          nullable: true
        weight:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1000
        status:
          $ref: "#/components/schemas/GoalStatus"
      minProperties: 1

    CheckIn:
      type: object
      properties:
        id:
          type: string
          format: uuid
        goal_id:
          type: string
          format: uuid
        value:
          type: number
          nullable: true
          description: Optional for habit goals (US-11)
        note:
          type: string
          nullable: true
        effort_rating:
          type: integer
          minimum: 1
          maximum: 5
        logged_for:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
      required: [id, goal_id, effort_rating, logged_for, created_at]

    CheckInCreateRequest:
      type: object
      properties:
        value:
          type: number
          exclusiveMinimum: -10000000000
          exclusiveMaximum: 10000000000
          nullable: true
        note:
          type: string
          maxLength: 2000
          nullable: true
        effort_rating:
          type: integer
          minimum: 1
          maximum: 5
        logged_for:
          type: string
          format: date
          description: Must be between 1970-01-01 and 2100-12-31 (422 otherwise).
      required: [effort_rating, logged_for]

    GoalScore:
      type: object
      properties:
        goal_id:
          type: string
          format: uuid
        pace:
          type: number
          minimum: 0
          maximum: 1
        consistency:
          type: number
          minimum: 0
          maximum: 1
        momentum:
          type: number
          minimum: 0
          maximum: 1
        effort:
          type: number
          minimum: 0
          maximum: 1
        total:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: null while grade is "Calibrating"
        grade:
          $ref: "#/components/schemas/Grade"
        is_frozen:
          type: boolean
          description: true if goal is completed and score is frozen (EC-08)
      required: [goal_id, pace, consistency, momentum, effort, grade, is_frozen]

    ScoreSnapshot:
      type: object
      properties:
        snapshot_date:
          type: string
          format: date
        pace:
          type: number
        consistency:
          type: number
        momentum:
          type: number
        effort:
          type: number
        total:
          type: integer
          nullable: true
      required: [snapshot_date, pace, consistency, momentum, effort, total]

    CategoryScore:
      type: object
      description: One per user category, in sort_order (every category is listed, even ones with no goals).
      properties:
        category:
          $ref: "#/components/schemas/CategoryRef"
        score:
          type: integer
          nullable: true
          description: null if category has no active goals (EC-10)
        has_active_goals:
          type: boolean
      required: [category, has_active_goals]

    AttentionGoal:
      type: object
      properties:
        goal_id:
          type: string
          format: uuid
        title:
          type: string
        score:
          type: integer
          nullable: true
        reason:
          type: string
          example: "Score dropped 12 points this week"
      required: [goal_id, title, reason]

    Dashboard:
      type: object
      properties:
        overall_score:
          type: integer
          nullable: true
          description: null if user has zero active goals (EC-09)
        overall_grade:
          $ref: "#/components/schemas/Grade"
        category_scores:
          type: array
          items:
            $ref: "#/components/schemas/CategoryScore"
        current_streak_days:
          type: integer
        best_streak_days:
          type: integer
        trend:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              score:
                type: integer
                nullable: true
            required: [date, score]
        attention:
          type: array
          items:
            $ref: "#/components/schemas/AttentionGoal"
      required:
        - overall_score
        - overall_grade
        - category_scores
        - current_streak_days
        - best_streak_days
        - trend
        - attention

    WeeklyReview:
      type: object
      properties:
        week_start:
          type: string
          format: date
        has_enough_history:
          type: boolean
          description: false shows a "not enough history" message instead of a comparison (US-17)
        overall_score:
          type: integer
          nullable: true
        previous_week_score:
          type: integer
          nullable: true
        score_change:
          type: integer
          nullable: true
        best_goal:
          type: object
          nullable: true
          properties:
            goal_id:
              type: string
              format: uuid
            title:
              type: string
            score:
              type: integer
          required: [goal_id, title, score]
        slipping_goal:
          type: object
          nullable: true
          properties:
            goal_id:
              type: string
              format: uuid
            title:
              type: string
            score:
              type: integer
          required: [goal_id, title, score]
      required: [week_start, has_enough_history]

    CategoryWeights:
      type: object
      description: >
        GET returns one row per user category in sort_order (weight 1 where
        none is stored). PUT upserts the rows sent; a category_id that is not
        one of the user's categories → 422 INVALID_CATEGORY.
      properties:
        weights:
          type: array
          items:
            type: object
            properties:
              category_id:
                type: string
                format: uuid
              weight:
                type: number
                exclusiveMinimum: 0
                exclusiveMaximum: 1000
                description: Must be greater than 0 and less than 1000 (matches the DB's CHECK (weight > 0) and Numeric(5,2))
            required: [category_id, weight]
      required: [weights]

    JournalTag:
      type: string
      description: >
        Normalised on save: trimmed, leading "#" removed, lowercased, runs of
        whitespace become "-". After that it must be 1-32 chars of letters,
        digits, "_" or "-" (Unicode letters allowed, plus combining marks so
        scripts like Devanagari work, e.g. "नेपाल"; regex
        `^[\p{L}\p{M}\p{N}_-]+$`), else 422. Duplicates (after normalising)
        are dropped, keeping first-seen order.
      minLength: 1
      maxLength: 32
      example: side-project

    JournalEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          maxLength: 120
        body:
          type: string
        mood:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: "1 Rough, 2 Low, 3 Okay, 4 Good, 5 Great"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/JournalTag"
          maxItems: 10
          description: Always an array (empty when none)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, title, body, mood, tags, created_at, updated_at]

    JournalEntryCreateRequest:
      type: object
      properties:
        title:
          type: string
          nullable: true
          maxLength: 120
          description: Trimmed; empty/whitespace-only is stored as null
        body:
          type: string
          minLength: 1
          maxLength: 50000
          description: Must contain non-whitespace text (422 otherwise). Stored as sent (not trimmed inside), line breaks kept.
        mood:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            $ref: "#/components/schemas/JournalTag"
          maxItems: 10
          default: []
      required: [body]

    JournalEntryUpdateRequest:
      type: object
      description: >
        Partial update. `title: null` / `mood: null` clear them; `tags`
        replaces the list (`[]` clears). `body` may not be null or blank.
        `created_at` is not editable.
      properties:
        title:
          type: string
          nullable: true
          maxLength: 120
        body:
          type: string
          minLength: 1
          maxLength: 50000
        mood:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            $ref: "#/components/schemas/JournalTag"
          maxItems: 10
      minProperties: 1

    JournalEntryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntry"
        total:
          type: integer
          description: Total entries matching the filters (all pages)
        limit:
          type: integer
        offset:
          type: integer
      required: [items, total, limit, offset]

    JournalStats:
      type: object
      properties:
        month:
          type: string
          example: "2026-10"
        entry_count:
          type: integer
          description: Entries created in this month
        avg_mood:
          type: number
          nullable: true
          description: Mean mood of this month's entries that have one, 1 decimal; null if none
        days:
          type: array
          description: One item per calendar day of the month, in order (for the mood strip)
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              entry_count:
                type: integer
              avg_mood:
                type: number
                nullable: true
            required: [date, entry_count, avg_mood]
        total_entries:
          type: integer
          description: All-time entry count (0 = show the empty state)
        tags:
          type: array
          description: All-time tag usage, most-used first, ties alphabetical
          items:
            type: object
            properties:
              tag:
                $ref: "#/components/schemas/JournalTag"
              count:
                type: integer
            required: [tag, count]
      required: [month, entry_count, avg_mood, days, total_entries, tags]
