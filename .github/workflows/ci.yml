name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lifetracker
          POSTGRES_PASSWORD: lifetracker
          POSTGRES_DB: life_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifetracker -d life_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://lifetracker:lifetracker@localhost:5432/life_tracker_test
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_MINUTES: "60"
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
        working-directory: .

      # Dependency audit (security review SEC-011).
      # The --ignore-vuln flags below are KNOWN, NON-REACHABLE advisories, see
      # docs/security-review.md SEC-011:
      #   - starlette 0.46.2 (pinned by fastapi==0.115.*): the app uses no form/
      #     multipart parsing, UploadFile, StaticFiles, FileResponse, HTTPEndpoint
      #     or request.url.
      #       PYSEC-2026-1941 = CVE-2025-54121   PYSEC-2026-1942 = CVE-2025-62727
      #       PYSEC-2026-161  = CVE-2026-48710   PYSEC-2026-2280 = CVE-2026-48817
      #       PYSEC-2026-2281 = CVE-2026-48818   PYSEC-2026-248  = CVE-2026-54282
      #       PYSEC-2026-249  = CVE-2026-54283
      #   - pytest 8.4.2 (test-only): PYSEC-2026-1845 = CVE-2025-71176
      # REMOVE the starlette ignores when FastAPI is bumped (and the pytest one
      # when pytest >= 9.0.3). Any NEW advisory still fails this step.
      - name: Audit backend dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1845

      - name: Run pytest (skip gracefully if no tests yet)
        working-directory: backend
        run: |
          if find tests -name "test_*.py" 2>/dev/null | grep -q .; then
            pytest -v
          else
            echo "No backend tests yet — skipping."
          fi

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json yet — running npm install instead."
            npm install
          fi

      # Dependency audit (security review SEC-011). Only shipped (non-dev)
      # dependencies, and only fails on high/critical. The 2 moderate
      # react-router advisories are known and non-reachable (see SEC-011).
      - name: Audit frontend dependencies (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend tests (skip gracefully if no tests yet)
        working-directory: frontend
        run: |
          if grep -q '"test"' package.json && find src -name "*.test.*" -o -name "*.spec.*" 2>/dev/null | grep -q .; then
            npm run test -- --run
          else
            echo "No frontend tests yet — skipping."
          fi
