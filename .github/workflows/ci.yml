name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lifetracker
          POSTGRES_PASSWORD: lifetracker
          POSTGRES_DB: life_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifetracker -d life_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://lifetracker:lifetracker@localhost:5432/life_tracker_test
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_MINUTES: "60"
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
        working-directory: .

      - name: Run pytest (skip gracefully if no tests yet)
        working-directory: backend
        run: |
          if find tests -name "test_*.py" 2>/dev/null | grep -q .; then
            pytest -v
          else
            echo "No backend tests yet — skipping."
          fi

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json yet — running npm install instead."
            npm install
          fi

      - name: Run frontend tests (skip gracefully if no tests yet)
        working-directory: frontend
        run: |
          if grep -q '"test"' package.json && find src -name "*.test.*" -o -name "*.spec.*" 2>/dev/null | grep -q .; then
            npm run test -- --run
          else
            echo "No frontend tests yet — skipping."
          fi
